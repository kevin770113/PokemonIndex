name: 自動更新寶可夢資料

on:
  schedule:
    - cron: '0 0 * * *' 
  workflow_dispatch: 

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. 取得專案原始碼
        uses: actions/checkout@v4

      - name: 2. 設定 Node.js 環境
        uses: actions/setup-node@v4
        with:
          node-version: '24' # 修正點 A：明確升級至 Node.js 24 以消除警告

      - name: 3. 執行資料爬蟲與清洗腳本
        # 修正點 B：不透過 npm run，直接呼叫 node 執行，避開任何 package.json 的格式風險
        run: node scripts/fetchPokemonData.js

      - name: 4. 提交並推播新資料
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 修正點 C：加上 || true，確保就算沒有新檔案也不會讓整個流程亮紅燈報錯
          git add public/pokemon-data.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 自動新增/更新寶可夢資料庫" && git push)
