name: 自動更新寶可夢資料

on:
  schedule:
    # 每天 UTC 時間 00:00 (台灣時間早上 08:00) 自動執行一次
    - cron: '0 0 * * *' 
  workflow_dispatch: 
    # 加上這行，允許你在 GitHub 網頁上隨時點擊按鈕「手動」執行

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 允許機器人提交新檔案到你的儲存庫

    steps:
      - name: 1. 取得專案原始碼
        uses: actions/checkout@v4

      - name: 2. 設定 Node.js 環境
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. 執行資料爬蟲與清洗腳本
        run: npm run fetch-data

      - name: 4. 提交並推播新資料 (若有產生新檔案)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/pokemon-data.json
          # 如果檔案有差異才 Commit，避免產生無效的空白提交紀錄
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 自動新增/更新寶可夢資料庫" && git push)
